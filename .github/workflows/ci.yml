# À placer dans .github/workflows/ci.yml À LA RACINE DU DÉPÔT
# (le dossier .github doit être à côté de docs/ et database/, pas
# dans backend/ — GitHub ne regarde qu'à cet endroit précis).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: siegevif_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Charger le schéma dans la base de test
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d siegevif_test -f database/schema.sql

      - name: Installer les dépendances
        working-directory: backend
        run: npm install

      - name: Lancer les tests
        working-directory: backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/siegevif_test
          SESSION_SECRET: secret-de-test-ci
        run: npm test
