<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Connexion — SiègeVif</title>
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-icon" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.6" />
        <path d="M3 9h18M3 15h18M8 5v4M8 15v4M16 5v4M16 15v4" stroke="currentColor" stroke-width="1.6" />
      </svg>
    </div>
    <h1 class="auth-title">SiègeVif</h1>
    <p class="auth-subtitle">Réservation de places en temps réel</p>

    <nav class="auth-tabs">
      <span class="auth-tab is-active">Connexion</span>
      <a class="auth-tab" href="inscription.html">Inscription</a>
    </nav>

    <p id="erreur-formulaire" class="auth-form-error" hidden></p>

    <form id="form-connexion" novalidate>
      <div class="auth-field">
        <label for="email">Email</label>
        <div class="auth-field-control">
          <input id="email" type="email" autocomplete="email" placeholder="sophie@mail.com" />
        </div>
        <p id="erreur-email" class="auth-field-error"></p>
      </div>

      <div class="auth-field">
        <label for="mot-de-passe">Mot de passe</label>
        <div class="auth-field-control">
          <input id="mot-de-passe" type="password" autocomplete="current-password" placeholder="••••••••" />
          <button type="button" id="toggle-mdp" class="auth-password-toggle" aria-label="Afficher le mot de passe">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z" stroke="currentColor" stroke-width="1.6" />
              <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6" />
            </svg>
          </button>
        </div>
        <p id="erreur-mdp" class="auth-field-error"></p>
      </div>

      <button type="submit" id="bouton-connexion" class="auth-submit">Se connecter</button>
    </form>

    <div class="auth-demo">
      <p class="auth-demo-title">Accès rapide démo</p>
      <div class="auth-demo-list" id="demo-access"></div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    brancherAfficherMotDePasse("mot-de-passe", "toggle-mdp");

    afficherAccesDemo((compte) => {
      document.getElementById("email").value = compte.email;
      document.getElementById("mot-de-passe").value = compte.motDePasse;
    });

    // Arrivée depuis Inscription via un clic sur un compte démo
    // (?email=...&mdp=... dans l'URL).
    const parametres = new URLSearchParams(location.search);
    if (parametres.get("email")) document.getElementById("email").value = parametres.get("email");
    if (parametres.get("mdp")) document.getElementById("mot-de-passe").value = parametres.get("mdp");

    document.getElementById("form-connexion").addEventListener("submit", async (evenement) => {
      evenement.preventDefault();
      afficherErreurFormulaire("");

      const email = document.getElementById("email").value.trim();
      const motDePasse = document.getElementById("mot-de-passe").value;
      let valide = true;

      if (!email || !estCourrielValide(email)) {
        afficherErreurChamp("email", "erreur-email", "L'adresse courriel n'est pas valide.");
        valide = false;
      } else {
        afficherErreurChamp("email", "erreur-email", "");
      }

      if (!motDePasse) {
        afficherErreurChamp("mot-de-passe", "erreur-mdp", "Le mot de passe est requis.");
        valide = false;
      } else {
        afficherErreurChamp("mot-de-passe", "erreur-mdp", "");
      }

      if (!valide) return;

      const bouton = document.getElementById("bouton-connexion");
      bouton.disabled = true;
      bouton.textContent = "Connexion…";

      try {
        const reponse = await fetch("/api/auth/connexion", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, motDePasse }),
        });

        if (!reponse.ok) {
          const corps = await reponse.json().catch(() => null);
          afficherErreurFormulaire(corps?.message ?? "Courriel ou mot de passe incorrect.");
          return;
        }

        location.href = "/seances";
      } catch {
        afficherErreurFormulaire("Impossible de joindre le serveur. Réessayez.");
      } finally {
        bouton.disabled = false;
        bouton.textContent = "Se connecter";
      }
    });
  </script>
</body>
</html>
